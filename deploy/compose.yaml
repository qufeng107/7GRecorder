services:
  7grecorder:
    image: 7grecorder:${GIT_SHA:?GIT_SHA must be set}
    container_name: 7grecorder
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: /etc/7grecorder/app.env
        required: false
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - /data/7grecorder:/data/7grecorder
      - /etc/7grecorder/master.key:/etc/7grecorder/master.key:ro
    networks:
      - 7grecorder
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bililiverecorder:
    image: ${BILILIVE_RECORDER_IMAGE:?set a pinned BililiveRecorder image tag}
    container_name: bililiverecorder
    restart: unless-stopped
    env_file:
      - path: /etc/7grecorder/recorder.env
        required: false
    environment:
      BREC_HTTP_BASIC_USER: ${RECORDER_BASIC_USER:?set RECORDER_BASIC_USER in app.env}
      BREC_HTTP_BASIC_PASS: ${RECORDER_BASIC_PASSWORD:?set RECORDER_BASIC_PASSWORD in app.env}
      PUID: ${APP_UID:-1000}
      PGID: ${APP_GID:-1000}
      UMASK: "002"
    volumes:
      - /data/7grecorder/recordings:/rec
    networks:
      - 7grecorder
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  7grecorder:
    name: 7grecorder
