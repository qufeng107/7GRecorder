name: Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
          cache: false

      - name: Setup pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Build backend binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cd backend
          go mod tidy
          go build -ldflags "-X github.com/7grecorder/7grecorder/backend/internal/version.BuildSHA=${GITHUB_SHA}" -o ../dist/7grecorder ./cmd/7grecorder

      - name: Create release artifact
        run: |
          set -euo pipefail
          mkdir -p release
          mkdir -p release/source
          cp Dockerfile.app Dockerfile.runtime release/source/
          cp -R deploy release/source/deploy
          mkdir -p release/source/scripts
          cp -R scripts/deploy release/source/scripts/deploy
          tar -cf release/source.tar -C release/source .
          rm -rf release/source
          mkdir -p release/frontend
          cp -R frontend/dist release/frontend/dist
          mkdir -p release/bin
          cp dist/7grecorder release/bin/7grecorder
          echo "${GITHUB_SHA}" > release/RELEASE_SHA
          tar -cf 7grecorder-release-${GITHUB_SHA}.tar -C release .
          sha256sum 7grecorder-release-${GITHUB_SHA}.tar > SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7grecorder-release-${{ github.sha }}
          path: |
            7grecorder-release-${{ github.sha }}.tar
            SHA256SUMS
          retention-days: 7

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy release to production
        run: |
          scp -P "${{ secrets.PROD_SSH_PORT }}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            7grecorder-release-${GITHUB_SHA}.tar SHA256SUMS scripts/deploy/deploy-release.sh \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/7grecorder/deploy/"

      - name: Deploy production
        run: |
          ssh -p "${{ secrets.PROD_SSH_PORT }}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "cd /opt/7grecorder/deploy && RELEASE_SHA=${GITHUB_SHA} RELEASE_TAR=7grecorder-release-${GITHUB_SHA}.tar bash ./deploy-release.sh"
