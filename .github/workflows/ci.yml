name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Backend format
        run: |
          cd backend
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            gofmt -w .
            while IFS= read -r file; do
              patch="$(git diff -- "$file" | base64 -w 0)"
              echo "::error file=backend/${file}::gofmt required; patch_base64=${patch}"
            done <<< "$files"
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Backend tidy modules
        run: cd backend && go mod tidy

      - name: Backend vet
        run: cd backend && go vet ./...

      - name: Backend test
        run: |
          cd backend
          set +e
          go test ./... 2>&1 | tee /tmp/7grecorder-backend-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "::group::backend test tail"
              tail -n 120 /tmp/7grecorder-backend-test.log
              echo "::endgroup::"
            }
            grep -E '(^--- FAIL|^[[:space:]]+[A-Za-z0-9_./-]+\.go:[0-9]+:|^FAIL[[:space:]]|panic:|fatal error:)' /tmp/7grecorder-backend-test.log > /tmp/7grecorder-backend-test-summary.log || true
            if [ ! -s /tmp/7grecorder-backend-test-summary.log ]; then
              tail -n 120 /tmp/7grecorder-backend-test.log > /tmp/7grecorder-backend-test-summary.log
            fi
            message="$(tail -n 80 /tmp/7grecorder-backend-test-summary.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Backend test failed::${message}"
            exit "$status"
          fi

      - name: Backend build
        run: mkdir -p dist && cd backend && go build -ldflags "-X github.com/7grecorder/7grecorder/backend/internal/version.BuildSHA=${GITHUB_SHA}" -o ../dist/7grecorder ./cmd/7grecorder

      - name: Migration clean DB smoke
        run: |
          mkdir -p /tmp/7grecorder-ci/db /tmp/7grecorder-ci/temp
          DATA_ROOT=/tmp/7grecorder-ci SQLITE_PATH=/tmp/7grecorder-ci/db/7grecorder.db TEMP_ROOT=/tmp/7grecorder-ci/temp ./dist/7grecorder migrate

      - name: Frontend install
        run: cd frontend && pnpm install --no-frozen-lockfile

      - name: Frontend lint
        run: |
          cd frontend
          set +e
          output="$(pnpm lint 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s' "$output" | tail -40 | base64 -w 0)"
            echo "::error file=frontend/src/pages/AdminDashboard.tsx::frontend lint failed; output_base64=${message}"
            exit "$status"
          fi

      - name: Frontend typecheck
        run: cd frontend && pnpm typecheck

      - name: Frontend test
        run: cd frontend && pnpm test

      - name: Frontend build
        run: cd frontend && pnpm build

      - name: Compose config
        run: docker compose -f deploy/compose.yaml --env-file .env.example config >/dev/null
